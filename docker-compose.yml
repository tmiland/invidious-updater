# Production docker-compose for Invidious + Companion + PostgreSQL.
#
# NOTE: this file is intentionally INDEPENDENT from the upstream
# iv-org/invidious docker-compose.yml, which is a DEVELOPMENT file
# (it builds the image from a local clone and ships no companion
# service). This file deploys prebuilt production images instead, so
# users don't need Crystal/build tooling. If you diff against upstream
# and see drift, that is expected — see
# https://docs.invidious.io/installation/ ("Docker-compose method
# (production)") before "syncing" anything.
services:

  invidious:
    image: quay.io/invidious/invidious:master
    # image: quay.io/invidious/invidious:latest-arm64 # ARM64/AArch64 devices
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Please read the following file for a comprehensive list of all available
      # configuration options and their associated syntax:
      # https://github.com/iv-org/invidious/blob/master/config/config.example.yml
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://localhost:8282"
          public_url: "http://localhost:8282"
        invidious_companion_key: "CHANGE_ME!!"
        # external_port:
        # domain:
        # https_only: false
        # statistics_enabled: false
        # admins: [""]
        # captcha_enabled: true
        # login_enabled: true
        # registration_enabled: true
        # statistics_enabled: false
        # Use the key generated in the 2nd step
        hmac_key: "CHANGE_ME!!"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    depends_on:
      invidious-db:
        condition: service_healthy

  companion:
    image: quay.io/invidious/invidious-companion:latest
    environment:
      # Use the same secret as invidious_companion_key in the invidious config above.
      - SERVER_SECRET_KEY=CHANGE_ME!!
    restart: unless-stopped
    # Remove "127.0.0.1:" if used from an external IP
    ports:
      - "127.0.0.1:8282:8282"
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    # cache for youtube library
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    # NOTE: do NOT bump the postgres major (14) casually — the data in the
    # postgresdata volume is tied to the major version and a tag bump alone
    # will refuse to start. A major upgrade needs pg_upgrade / dump+restore.
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

volumes:
  postgresdata:
  companioncache:
