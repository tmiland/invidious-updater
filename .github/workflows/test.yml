name: OS tests

# Smoke-tests invidious_update.sh on every supported distro family.
# GitHub-hosted runners are Ubuntu-only, so non-Ubuntu distros run in
# containers on ubuntu-latest. Linux Mint has no official image — it shares
# the Debian code path, so the Ubuntu jobs cover it.
#
# What the smoke test proves per OS: distro detection accepts the OS
# (no "unknown distro" exit), --help works, the interactive menu boots
# and exits cleanly, and invalid flags fail. UPDATE_SCRIPT=no keeps the
# runs hermetic (no GitHub API calls). Full installs stay opt-in in
# install.yml (needs systemd + network + time).

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash syntax check
        run: bash -n invidious_update.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          # deb control file is Debian metadata, not shell
          ignore_names: control

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: update_config() + pg_hba unit tests
        run: |
          # Run the REAL update_config() function pulled from the script
          # (sudo: it writes to /home/backup/$USER_NAME).
          sudo bash <<'TEST'
          set -euo pipefail
          GREEN= ARROW= DONE= ERROR= RED= NC=
          fn=$(awk '/^update_config\(\)/,/^}/' invidious_update.sh)
          eval "$fn"
          cat > /tmp/sample.yml <<'YML'
          # Invidious config for https://invidious.example.com
          dbname: invidious
          password: kemal
          domain: invidious.example.com
          port: 3000
          https_only: false
          external_port:
          dbinstance:
          youtube_api_key:
          youtube_api_key3:
          obs_url:
          logs:
          YML
          USER_NAME=ci PSQLPASS='p/a&ss 2' PSQLDB='inv_main' DOMAIN='video.example.org' \
          HTTPS_ONLY='true' EXTERNAL_PORT='8443' PORT='3000' IP='0.0.0.0' \
          ADMINS='alice' CAPTCHA_KEY='cap/key&1' IN_CONFIG=/tmp/sample.yml \
          update_config
          echo "--- resulting config ---"
          cat /tmp/sample.yml
          # inserted keys present, landed immediately before the original 11th line (obs_url:)
          grep -q 'check_tables: true' /tmp/sample.yml
          grep -q 'captcha_api_url: https://api.anti-captcha.com' /tmp/sample.yml
          grep -q 'admins: ' /tmp/sample.yml
          grep -q -- '- alice' /tmp/sample.yml
          # default values replaced; / and & values stayed literal
          grep -q 'password: p/a&ss 2' /tmp/sample.yml
          grep -q 'dbname: inv_main' /tmp/sample.yml
          grep -q 'domain: video.example.org' /tmp/sample.yml
          test "$(grep -c '^obs_url:' /tmp/sample.yml)" -eq 1
          echo "update_config OK"

          # pgbackup() pg_hba transform keeps other rules intact
          f=$(mktemp)
          cat > "$f" <<'HBA'
          # TYPE  DATABASE        USER            ADDRESS                 METHOD
          local   all             postgres                                peer
          local   all             all                                     peer
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             ::1/128                 scram-sha-256
          host    replication     all             127.0.0.1/32            scram-sha-256
          HBA
          cp "$f" "$f.bak"
          sed -i -E 's/^(\s*local\s+all\s+postgres\s+)\S+.*/\1trust/' "$f"
          grep -q 'local   all             postgres                                trust' "$f"
          grep -q 'local   all             all                                     peer' "$f"
          grep -q 'host    all             all             127.0.0.1/32            scram-sha-256' "$f"
          grep -q 'host    replication     all             127.0.0.1/32            scram-sha-256' "$f"
          echo "pg_hba OK"

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            setup: apt-get update -qq && apt-get install -y -qq lsb-release curl git sudo
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq lsb-release curl git sudo
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq lsb-release curl git sudo
          - image: pureos/byzantium:latest
            setup: apt-get update -qq && apt-get install -y -qq lsb-release curl git sudo
          - image: fedora:40
            setup: dnf install -y -q redhat-lsb-core curl git sudo
          - image: archlinux:latest
            setup: pacman -Sy --noconfirm lsb-release curl git sudo
    container:
      image: ${{ matrix.image }}
    # Container jobs default to sh (dash) — the smoke script uses
    # bashisms (herestring <<<), so pin bash explicitly.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install test deps
        run: ${{ matrix.setup }}

      - name: Smoke test
        run: |
          set -u
          echo "--- lsb_release: $(lsb_release -si) ($(lsb_release -sr))"
          echo "--- --help (expect exit 0)"
          UPDATE_SCRIPT=no bash invidious_update.sh --help | tee /tmp/help.txt
          echo "--- menu boot + exit (expect exit 0)"
          UPDATE_SCRIPT=no bash invidious_update.sh <<< '11' | tee /tmp/menu.txt
          echo "--- invalid flag (expect exit 1)"
          if UPDATE_SCRIPT=no bash invidious_update.sh --bogus-flag > /tmp/bogus.txt 2>&1; then
            echo "ERROR: invalid flag exited 0"; cat /tmp/bogus.txt; exit 1
          fi
          echo "--- assert no distro errors"
          if grep -qi "unknown distro\|not supported" /tmp/help.txt /tmp/menu.txt; then
            echo "ERROR: distro not accepted on ${{ matrix.image }}"; exit 1
          fi
          echo "SMOKE OK on ${{ matrix.image }}"
